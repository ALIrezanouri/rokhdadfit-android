name: Android Online Free Cloud Builder

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from the browser

jobs:
  build:
    name: Build Release APK & AAB
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission to Gradle Wrapper
      run: chmod +x gradlew || true

    - name: Build Debug App Bundle (AAB) & APK
      run: ./gradlew assembleDebug bundleDebug --stacktrace

    - name: Upload Debug APK Output
      uses: actions/upload-artifact@v4
      with:
        name: athlete-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Debug AAB Output
      uses: actions/upload-artifact@v4
      with:
        name: athlete-debug-bundle
        path: app/build/outputs/bundle/debug/app-debug.aab
